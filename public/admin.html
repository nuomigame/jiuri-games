<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理面板 · 爱冒险玖日</title>
  <link rel="icon" href="/assets/img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin.css?v=3" />
</head>
<body>
  <!-- Gate -->
  <div class="gate" id="gate">
    <div class="gate-panel">
      <div class="gate-logo"><img src="/assets/img/logo.png" alt="" /></div>
      <h1 class="gate-title">管理面板</h1>
      <p class="gate-sub">仅限管理员访问</p>
      <form class="gate-form" id="gateForm">
        <label class="field">
          <span class="field-label">用户名</span>
          <input type="text" name="username" autocomplete="username" required />
        </label>
        <label class="field">
          <span class="field-label">密码</span>
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <p class="form-error" id="gateError" hidden></p>
        <button class="btn btn-primary btn-block" type="submit">进入后台</button>
      </form>
      <a class="gate-back" href="/">← 返回网站</a>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="dash" id="dash" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-logo"><img src="/assets/img/logo.png" alt="" /></span>
        <span class="topbar-title">爱冒险玖日 · 管理后台</span>
      </div>
      <div class="topbar-right">
        <a class="btn btn-ghost btn-sm" href="/" target="_blank" rel="noopener">查看网站 ↗</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">退出登录</button>
      </div>
    </header>

    <main class="content">
      <div class="content-head">
        <div>
          <p class="kicker">控制台</p>
          <h1 class="page-title">游戏管理</h1>
        </div>
        <button class="btn btn-primary" id="createBtn">+ 创建游戏</button>
      </div>

      <div class="stat-row" id="statRow">
        <div class="stat"><b id="statGames">0</b><span>游戏总数</span></div>
        <div class="stat"><b id="statFeatured">0</b><span>精选游戏</span></div>
        <div class="stat"><b id="statUsers">0</b><span>注册用户</span></div>
      </div>

      <section class="card">
        <div class="card-head">
          <h2>全部游戏</h2>
          <span class="card-count" id="gameCountReal">0 款</span>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>封面</th>
                <th>游戏</th>
                <th>标签</th>
                <th>状态</th>
                <th>链接</th>
                <th class="ta-r">操作</th>
              </tr>
            </thead>
            <tbody id="gamesBody"></tbody>
          </table>
        </div>
        <div class="empty" id="gamesEmpty" hidden>还没有游戏，点击右上角「创建游戏」开始吧。</div>
      </section>

      <section class="card">
        <div class="card-head"><h2>注册用户</h2><span class="card-count" id="usersCount2">0 人</span></div>
        <div class="table-wrap">
          <table class="table table-sm">
            <thead>
              <tr><th>用户名</th><th>邮箱</th><th>角色</th><th class="ta-r">注册时间</th><th class="ta-r">操作</th></tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h2>账号安全</h2></div>
        <form class="security-form" id="passwordForm">
          <label class="field"><span class="field-label">当前密码</span><input type="password" name="oldPassword" autocomplete="current-password" required /></label>
          <label class="field"><span class="field-label">新密码（至少 8 位）</span><input type="password" name="newPassword" autocomplete="new-password" minlength="8" required /></label>
          <p class="form-error" id="pwdError" hidden></p>
          <button type="submit" class="btn btn-primary" id="pwdBtn">修改密码</button>
        </form>
      </section>
    </main>
  </div>

  <!-- Create / Edit Modal -->
  <div class="modal" id="editor" hidden>
    <div class="modal-backdrop" data-close-editor></div>
    <div class="modal-panel modal-wide">
      <button class="modal-close" data-close-editor aria-label="关闭">×</button>
      <p class="kicker" id="editorKicker">创建游戏</p>
      <h2 class="modal-title" id="editorTitle">新建游戏</h2>
      <form class="editor-form" id="editorForm">
        <input type="hidden" name="id" />
        <label class="field">
          <span class="field-label">游戏名称 *</span>
          <input type="text" name="title" required maxlength="80" placeholder="例如：光之迷宫" />
        </label>
        <label class="field">
          <span class="field-label">游戏链接 *</span>
          <input type="url" name="link" required placeholder="https://... 网页游戏地址" />
        </label>
        <label class="field">
          <span class="field-label">简介</span>
          <textarea name="description" rows="3" maxlength="600" placeholder="一句话介绍这个游戏"></textarea>
        </label>

        <div class="cover-block">
          <span class="field-label">封面图</span>
          <div class="cover-row">
            <div class="cover-preview" id="coverPreview">
              <img src="/assets/img/card-default.jpg" alt="" />
              <input type="hidden" name="cover" id="coverData" value="/assets/img/card-default.jpg" />
            </div>
            <div class="cover-controls">
              <label class="upload-btn">
                <input type="file" id="coverFile" accept="image/*" hidden />
                上传封面
              </label>
              <p class="cover-hint">支持 JPG / PNG / WebP，小于 8MB。也可直接粘贴图片链接：</p>
              <input type="text" id="coverUrl" placeholder="https://... 或直接填链接" />
            </div>
          </div>
        </div>

        <label class="field">
          <span class="field-label">标签（用逗号分隔）</span>
          <input type="text" name="tags" id="tagsInput" placeholder="冒险, 像素, 竞速" />
        </label>

        <label class="check">
          <input type="checkbox" name="featured" id="featuredInput" />
          <span>设为精选（优先展示）</span>
        </label>

        <p class="form-error" id="editorError" hidden></p>
        <div class="editor-actions">
          <button type="button" class="btn btn-ghost" data-close-editor>取消</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">保存游戏</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/js/admin.js?v=3"></script>
</body>
</html>
