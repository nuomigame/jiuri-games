<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>账户充值 · 爱冒险玖日</title>
  <link rel="icon" href="/assets/img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=5" />
  <link rel="stylesheet" href="/css/studio.css?v=1" />
  <style>
    .rc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 36px; align-items: start; }
    .rc-card { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; }
    .rc-balance { font-size: 38px; font-weight: 900; color: var(--accent); font-family: var(--font-mono); margin-top: 8px; }
    .rc-balance small { font-size: 16px; color: var(--muted); font-weight: 400; margin-right: 6px; }
    .rc-qr { width: 220px; height: 220px; margin: 8px auto 0; display: block; border-radius: 12px; background: #fff; object-fit: contain; padding: 6px; }
    .rc-qr { cursor: zoom-in; }
    .rc-qr-empty { text-align: center; color: var(--muted); padding: 60px 0; border: 1px dashed var(--line); border-radius: 12px; margin-top: 12px; }
    .qr-panel { width: min(420px, 92vw); text-align: center; }
    .qr-modal-title { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
    .rc-qr-big { width: min(320px, 80vw); height: min(320px, 80vw); margin: 0 auto; display: block; border-radius: 14px; background: #fff; object-fit: contain; padding: 10px; }
    .pay-tabs { display: flex; gap: 8px; margin: 6px 0 16px; }
    .pay-tab { flex: 1; height: 40px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); color: var(--txt-2); font-size: 14px; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
    .pay-tab.is-active { background: var(--accent); color: #0a0a0c; border-color: var(--accent); }
    .rc-amount { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
    .rc-amount .cur { font-size: 22px; color: var(--accent); font-family: var(--font-mono); }
    .rc-amount input { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; color: var(--txt); font-size: 22px; font-family: var(--font-mono); }
    .rc-history { margin-top: 30px; }
    .rc-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
    .rc-row .amt { font-family: var(--font-mono); font-size: 16px; color: var(--txt); }
    @media (max-width: 820px) { .rc-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="studio-nav">
    <div class="studio-nav-inner container">
      <a class="brand" href="/"><span class="brand-mark"><img src="/assets/img/logo.png" alt="" /></span><span class="brand-name">爱冒险玖日<em>Recharge</em></span></a>
      <nav class="studio-links"><a href="/store">商店</a><a href="/">首页</a><a href="/studio">AI 工坊</a></nav>
      <div class="nav-actions"><button class="btn btn-ghost user-btn" id="navAuthBtn">登录 / 注册</button></div>
    </div>
  </header>

  <main class="studio container">
    <section class="studio-intro">
      <p class="kicker">TOP UP</p>
      <h1 class="studio-title">账户<span>充值</span></h1>
      <p class="studio-sub">扫码向站长支付后，填写你实际支付的金额提交，站长确认后就会到账。到账的余额可用于 AI 游戏生成等付费功能。</p>
    </section>

    <div class="rc-grid">
      <section class="rc-card">
        <h2 class="card-h">我的余额</h2>
        <div class="rc-balance"><small>¥</small><span id="balNum">0.00</span></div>
        <div class="studio-meta" style="margin-top:18px"><span id="minHint">最低充值：¥1.00</span><a href="/studio" style="color:var(--accent)">去 AI 工坊生成游戏 ›</a></div>
      </section>

      <section class="rc-card">
        <h2 class="card-h">扫码支付</h2>
        <div class="pay-tabs" id="payTabs">
          <button type="button" class="pay-tab is-active" data-pay="alipay">支付宝</button>
          <button type="button" class="pay-tab" data-pay="wechat">微信</button>
        </div>
        <div id="qrWrap"></div>
        <p class="cover-hint" style="margin-top:12px">用微信/支付宝扫描上方二维码，向站长转账相应金额，然后把下面的金额填成你实际支付的数。</p>
        <div class="rc-amount">
          <span class="cur">¥</span>
          <input type="number" id="amountInput" min="1" step="1" placeholder="填写充值金额（元）" />
        </div>
        <label class="field"><span class="field-label">备注（选填）</span><input type="text" id="noteInput" maxlength="100" placeholder="你的昵称或转账备注" /></label>
        <button class="btn btn-primary btn-block" id="submitBtn">提交充值申请</button>
        <p class="form-error" id="rcError" hidden></p>
      </section>
    </div>

    <section class="rc-card rc-history">
      <h2 class="card-h">充值记录</h2>
      <div id="rcList"></div>
      <div class="rc-qr-empty" id="rcEmpty" hidden>还没有充值记录。</div>
    </section>
  </main>

  <div class="modal qr-modal" id="qrModal" hidden>
    <div class="modal-backdrop" data-close-qr></div>
    <div class="modal-panel qr-panel">
      <button class="modal-close" data-close-qr aria-label="关闭">×</button>
      <p class="qr-modal-title">用微信 / 支付宝 「扫一扫」</p>
      <img id="qrBig" class="rc-qr-big" src="" alt="收款码" />
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="/js/recharge.js?v=4"></script>
</body>
</html>
